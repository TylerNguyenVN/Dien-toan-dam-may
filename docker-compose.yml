version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: csv_analytics_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: csv_analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    container_name: csv_analytics_api
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/csv_analytics
    volumes:
      - ./data:/app/data

volumes:
  pgdata:
