name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Verification & Acceptance Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Reference Dataset
        run: |
          python scripts/generate_dataset.py --rows 100 --seed 42 --output-csv data/reference_dataset.csv --output-metrics data/reference_metrics.json
          python scripts/generate_dataset.py --rows 100000 --seed 42 --output-csv data/benchmark_100k.csv --output-metrics data/benchmark_100k_metrics.json

      - name: Run Test 1, Test 2, Test 3 & Failure Drill
        run: |
          python -m pytest backend/tests/ -v -s

  docker-build:
    name: Build & Validate Container Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: csv-analytics:latest
